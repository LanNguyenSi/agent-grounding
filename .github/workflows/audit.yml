name: Audit

# Regression guard: fails when a high/critical advisory is present in the
# dependency tree (`npm audit --audit-level=high`).
#
# This is a SEPARATE workflow (not folded into ci.yml) on purpose: ci.yml is
# reused by release.yml via `workflow_call`, so a blocking audit step inside it
# would let a newly published external advisory turn a release red with zero
# code change. As its own pull_request + push gate, this guards PRs and master
# against re-introducing a high/critical (e.g. the nested js-yaml@3 cleared in
# PR #119) without coupling the release path to externally timed advisory
# publication. `--audit-level=high` lets dev-only moderate advisories through;
# a high/critical in any tier (devDependencies included) does block, by design,
# since the audit covers the full hoisted tree, not only runtime deps.
#
# Enforcement note: this produces a failing "Audit" check, but it only blocks a
# merge once "Audit" is listed as a required status check in branch protection.
#
# Coupling note (PR #159 / GHSA-mh99-v99m-4gvg, brace-expansion DoS): the root
# package.json overrides brace-expansion, minimatch, and test-exclude as a
# COUPLED set — minimatch@^10.2.5 and test-exclude@^8.0.0 are the first
# releases that consume brace-expansion 5.x's named `expand` export instead of
# the pre-5.x callable default. This audit gate alone does NOT catch a broken
# partial override: removing (or never adding) only the minimatch and
# test-exclude overrides, while the brace-expansion override stays in place,
# still resolves brace-expansion@5.x (nothing else in the tree pins it lower)
# and stays `npm audit --audit-level=high` green, while the old minimatch/
# test-exclude npm's ordinary resolution falls back to in their absence
# throws at runtime:
#   TypeError: (0 , brace_expansion_1.default) is not a function
# The `check:pins` script (scripts/check-pins.js, run in ci.yml) is the
# companion gate that actually enforces the coupling; this audit step only
# tells you the resolved tree has no known CVE, not that it is internally
# consistent.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: npm audit (high and critical)
        # Single root lockfile (npm workspace monorepo) audits the whole tree.
        # `npm audit` reads package-lock.json directly, so no install is needed.
        run: npm audit --audit-level=high
