name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call: {}

# Cancel superseded runs on the same branch so rapid pushes don't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Red-on-drift counterpart to the warn-only okf-staleness.yml drift watch:
  # that workflow never fails a build (see its own header comment), so a
  # commit that shifts a docs/okf citation's cited range out of the
  # section or content it names would go unnoticed there. This job runs
  # the identical bundle check (same okf-kit pin, same command) and turns
  # this job red on any citations-resolve WARNING (both the base subtypes
  # such as missing-file/inverted-range/blank-start-line, the four
  # anchor-heading subtypes anchor-not-found-in-range/anchor-heading-mismatch/
  # anchor-heading-does-not-enclose/anchor-heading-not-found, and the four
  # --require-anchors subtypes anchor-required/anchor-not-on-last-line/
  # anchor-not-unique-in-range/test-range-straddles-block), on any
  # citations-resolve `unresolved-ambiguous` NOTICE (an ambiguous target
  # means the citation was never evaluated at all -- that is a coverage
  # gap, not a clean bill of health, so it does not get the same pass the
  # rest of --strict's notice tier gets), and on `.summary.errors > 0` from
  # okf-kit itself (e.g. a malformed/missing frontmatter `type:` field) --
  # a bundle-level error is a stronger signal than a single citation
  # warning and must not slip through a job that only ever looked at
  # citations-resolve findings. `docs/okf/log.md` is the one exception: it
  # is reserved/append-only history (see scripts/check-okf-test-citation-shape.js's
  # own RESERVED_DOCS, and okf-kit's own reserved-doc carve-out for
  # index.md/log.md under --require-anchors), so every citations-resolve
  # finding against it is excluded from the two blocking selectors below
  # and surfaced instead, non-blocking, in its own step-summary section
  # (see the "Citation guard" step). Every OTHER notice is surfaced in
  # the step summary for visibility but does not fail the job, matching
  # --strict's own severity
  # split for everything except the ambiguous-citation carve-out above.
  # sources-fresh staleness stays entirely out of this job; okf-staleness.yml
  # already surfaces it, warn-only, by design.
  #
  # Whether this is a hard merge gate depends on whether an operator has
  # added "OKF bundle citation guard" to `master`'s required status checks
  # in branch protection: only then does a red run here block the PR
  # "Merge" button; check `gh api repos/<owner>/<repo>/branches/master/protection
  # --jq '.required_status_checks.contexts'` to see the live state (see
  # docs/okf/log.md's 2026-08-26 entry for the state as last verified, and
  # docs/okf/merge-approval-gate-mechanics.md for the same mechanism applied
  # to the `merge-approval` check). It DOES unconditionally gate releases
  # regardless of branch protection: release.yml's `release` job
  # `needs: ci`, and `ci` there is this whole ci.yml file invoked via
  # `workflow_call` (below), so a red job here fails that reusable-workflow
  # call and blocks the tag-triggered release run.
  okf-anchor-guard:
    name: OKF bundle citation guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only: this job only checks out and reads the bundle, never
    # writes back to the repo or calls the GitHub API. Matches
    # okf-staleness.yml's own workflow-level `permissions: contents: read`.
    permissions:
      contents: read
    env:
      BUNDLE_PATH: docs/okf
    steps:
      - uses: actions/checkout@v4
        with:
          # citations-resolve's repo-root auto-detection runs `git
          # rev-parse --show-toplevel`; a full checkout keeps this job's
          # checkout identical to okf-staleness.yml's rather than a
          # second, subtly different recipe to keep in sync.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install okf-kit (exact pin)
        # Keep this pin identical to okf-staleness.yml's (also asserted by
        # `npm run check:okf-kit-pin` in the `ci` job below). A plain
        # `npm install -g` against the public registry, deliberately: this
        # is a registry install with no lockfile entry and no `--integrity`
        # hash to verify against, unlike every dependency this repo
        # installs via `npm ci` from package-lock.json. That is a
        # conscious, narrow exception to the repo's lockfile-integrity
        # posture (see check-lockfile-integrity.js) for this one CLI, not
        # an oversight.
        run: npm install -g okf-kit@0.8.0

      - name: Assert CLI is alive (output, not exit code)
        shell: bash
        run: |
          v="$(okf-kit --version)"
          test -n "$v"
          echo "okf-kit ${v}"

      - name: Citation guard
        shell: bash
        run: |
          set +e
          # --require-anchors opts into okf-kit's own anchor-required /
          # anchor-not-on-last-line / anchor-not-unique-in-range /
          # test-range-straddles-block checks (all reported under
          # ruleId citations-resolve, severity warning, message tagged
          # e.g. "[anchor-required]"), which as of okf-kit@0.8.0 replace
          # what this repo used to enforce itself in
          # scripts/check-okf-anchors.js (removed; see docs/okf/log.md and
          # the "OKF anchor-discipline check" step below for the one rule
          # that still has no okf-kit equivalent). --require-anchors-allow
          # is omitted: check-okf-anchors.js's own ALLOWLIST was empty --
          # every full citation in this bundle already carries an anchor.
          okf-kit check --require-anchors --json "${BUNDLE_PATH}" > okf-anchor-report.json
          code=$?
          set -e

          if [ "${code}" -ne 0 ] && [ "${code}" -ne 1 ]; then
            echo "::error title=OKF citation guard::okf-kit check exited ${code} (tool/usage error, not bundle findings)"
            cat okf-anchor-report.json || true
            exit "${code}"
          fi

          jq -e . okf-anchor-report.json > /dev/null

          errors=$(jq -e '.summary.errors | numbers' okf-anchor-report.json)

          # log.md is reserved (append-only history, exempt from anchor
          # discipline entirely, both by scripts/check-okf-test-citation-shape.js's
          # own RESERVED_DOCS and by okf-kit's --require-anchors reserved-doc
          # carve-out), but okf-kit's citations-resolve still
          # checks log.md's full citations for drift/ambiguity like any
          # other doc (only its short-form matcher skips reserved files).
          # That is an intentional asymmetry, not an oversight: log.md
          # narrates past fixes and deliberately leaves some old citations
          # ambiguous/unqualified on purpose (see its own note on the
          # pattern). Blocking releases on a future SOURCE refactor shifting
          # an append-only history entry's citation would be exactly the
          # wrong failure mode for a file this job otherwise treats as
          # exempt, so every citations-resolve finding against log.md is
          # excluded from the two blocking selectors below and surfaced
          # instead, non-blocking, in its own step-summary section.
          logFindings=$(jq '[
            .findings[]
            | select(.file == "log.md" and .ruleId == "citations-resolve")
          ]' okf-anchor-report.json)
          logFindingCount=$(echo "${logFindings}" | jq -e 'length')

          # citations-resolve WARNINGs (base + anchor subtypes) always
          # block, except in log.md (see above). citations-resolve
          # `unresolved-ambiguous` NOTICEs also block here even though
          # --strict itself never counts a notice: an ambiguous target was
          # never evaluated by citations-resolve at all, so a green run
          # must not read as "every citation checked out" when one was
          # skipped outright -- again except in log.md.
          citationFindings=$(jq '[
            .findings[]
            | select(.ruleId == "citations-resolve" and .severity == "warning" and .file != "log.md")
          ]' okf-anchor-report.json)
          count=$(echo "${citationFindings}" | jq -e 'length')

          ambiguousFindings=$(jq '[
            .findings[]
            | select(.ruleId == "citations-resolve" and .severity == "notice" and (.message | contains("[unresolved-ambiguous]")) and .file != "log.md")
          ]' okf-anchor-report.json)
          ambiguousCount=$(echo "${ambiguousFindings}" | jq -e 'length')

          # Every other notice (any severity-"notice" finding not already
          # counted above -- e.g. a sources-fresh "staleness not assessable"
          # notice) is informational only: surfaced below, but never a
          # reason to fail this job. citations-resolve only ever emits a
          # notice for `unresolved-ambiguous`, so this selector never
          # overlaps logFindings/ambiguousFindings above.
          otherNotices=$(jq '[
            .findings[]
            | select(.severity == "notice")
            | select((.ruleId == "citations-resolve" and (.message | contains("[unresolved-ambiguous]"))) | not)
          ]' okf-anchor-report.json)
          otherNoticeCount=$(echo "${otherNotices}" | jq -e 'length')

          {
            echo "## OKF bundle citation guard (\`${BUNDLE_PATH}\`)"
            echo ""
            echo "errors: ${errors}, citations-resolve warnings: ${count}, unresolved-ambiguous notices: ${ambiguousCount}, log.md findings (non-blocking): ${logFindingCount}, other notices: ${otherNoticeCount}"
            if [ "${count}" -gt 0 ]; then
              echo ""
              echo "### citations-resolve warnings"
              echo '```'
              echo "${citationFindings}" | jq -r '.[] | "\(.file): \(.message)"'
              echo '```'
            fi
            if [ "${ambiguousCount}" -gt 0 ]; then
              echo ""
              echo "### unresolved-ambiguous citations (not evaluated -- treated as a coverage gap)"
              echo '```'
              echo "${ambiguousFindings}" | jq -r '.[] | "\(.file): \(.message)"'
              echo '```'
            fi
            if [ "${logFindingCount}" -gt 0 ]; then
              echo ""
              echo "### log.md findings (non-blocking -- reserved append-only history, see this job's own header comment)"
              echo '```'
              echo "${logFindings}" | jq -r '.[] | "\(.severity) [\(.ruleId)]: \(.message)"'
              echo '```'
            fi
            if [ "${otherNoticeCount}" -gt 0 ]; then
              echo ""
              echo "### other notices (informational, non-blocking)"
              echo '```'
              echo "${otherNotices}" | jq -r '.[] | "\(.file) [\(.ruleId)]: \(.message)"'
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${errors}" -gt 0 ] || [ "${count}" -gt 0 ] || [ "${ambiguousCount}" -gt 0 ]; then
            echo "${citationFindings}" | jq -r '.[] | "::error title=OKF citation drift::\(.file): \(.message)"'
            echo "${ambiguousFindings}" | jq -r '.[] | "::error title=OKF citation not evaluated::\(.file): \(.message)"'
            if [ "${errors}" -gt 0 ]; then
              echo "::error title=OKF bundle error::${errors} okf-kit error(s), see the report above"
            fi
            exit 1
          fi

          echo "Clean: 0 errors, 0 citations-resolve warnings, 0 unresolved-ambiguous citations (log.md excluded, see above)."
          exit 0

      - name: OKF test-citation-shape check (repo-local, on top of okf-kit)
        # As of okf-kit@0.8.0, --require-anchors above covers what
        # scripts/check-okf-anchors.js used to enforce by hand, except one
        # rule okf-kit has no equivalent for: a full citation into a
        # *.test.ts file must span exactly one test -- range start on the
        # describe(/it(/test( head of the test the citing sentence names,
        # range end on that test's own closing });. okf-kit's own
        # test-range-straddles-block only rejects a range that straddles
        # into a SIBLING or OUTER block; it does not require the range to
        # touch a block boundary at all, so a range entirely inside one
        # test's body (never starting on its head or ending on its close)
        # straddles nothing and would pass okf-kit clean while still
        # failing this shape rule. Kept as its own small, additive check.
        # Pure Node core, no okf-kit dependency.
        run: npm run check:okf-test-citation-shape

      - name: OKF test-citation-shape checker unit tests
        # Fixture-based unit tests for the checker (including the two
        # required negative controls: range not starting on a test head,
        # range not ending on the test's own closing });), plus a sanity
        # check that runs the real checker against this repo's actual
        # docs/okf/ bundle.
        run: npm run test:check-okf-test-citation-shape

      - name: okf-kit pin-coupling check
        # Asserts this workflow's own "npm install -g okf-kit@..." pin
        # (above) matches okf-staleness.yml's -- see check-okf-kit-pin.js
        # for why nothing else couples the two.
        run: npm run check:okf-kit-pin

      - name: okf-kit pin-coupling checker unit tests
        # Fixture-based unit tests for the checker (including a negative
        # control: a deliberately diverging pin), plus a sanity check
        # against this repo's real workflow files.
        run: npm run test:check-okf-kit-pin

      - name: okf-kit selector-coupling check
        # Couples this job's own jq selectors (above) to okf-kit's JSON
        # finding shape: replays the extracted selectors against two
        # canonical okf-kit@0.8.0 reports (scripts/fixtures/okf-selectors/)
        # and asserts each blocking selector still selects exactly what it
        # is supposed to. See scripts/check-okf-selectors.js for why (this
        # repeats the pin-coupling check's rationale for a different kind
        # of silent drift).
        run: npm run check:okf-selectors

      - name: okf-kit selector-coupling checker unit tests
        # Fixture-based unit tests, including the required negative
        # control: a one-character typo in a blocking selector run against
        # a temp copy of ci.yml must fail red.
        run: npm run test:check-okf-selectors

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # These two lockfile-integrity steps run BEFORE `npm ci` on purpose:
      # both scripts only use Node core (fs/path) plus node:test/assert for
      # the unit tests — no installed dependency is required — and the whole
      # point of the check is to gate whether it's even safe to run `npm ci`
      # against this lockfile in the first place (an unverifiable entry is a
      # problem for `npm ci` itself, not just for whatever it installs).
      # Failing here means CI never even attempts the install.
      - name: Lockfile integrity check
        # Asserts every third-party entry in package-lock.json's "packages"
        # map carries both `resolved` and `integrity` — the fields `npm ci`
        # needs to actually verify a package's checksum instead of silently
        # trusting whatever tarball the registry hands back. Catches a
        # regenerated-from-a-bad-source or hand-edited lockfile drifting
        # back into the state task eefeb6a9 found and fixed (304 of 603
        # entries missing one or both fields as of 2026-07-27).
        run: npm run check:lockfile-integrity

      - name: Lockfile integrity checker unit tests
        # Fixture-based unit tests for the checker function itself
        # (including a negative control); mostly in-memory and disposable
        # temp-file fixtures, plus a sanity check that reads (but never
        # writes) the real root package-lock.json.
        run: npm run test:check-lockfile-integrity

      - name: Install
        run: npm ci

      - name: Pin consistency check
        # Asserts every internal @lannguyensi/* dependency pin across
        # packages/*/package.json is satisfiable by the sibling workspace's
        # current version. Catches a stale pin left behind after a version
        # bump; the per-tag version guard only checks the tagged package's
        # own version field, not what it pins.
        run: npm run check:pins

      - name: Pin consistency checker unit tests
        # Fixture-based unit tests for the checker function itself
        # (including a negative control); mostly in-memory fixtures, plus a
        # couple of tests that read (but never write) the real root
        # manifests.
        run: npm run test:check-pins

      - name: Dependency consistency check
        # Asserts every external runtime dependency declared in
        # packages/*/package.json's `dependencies` field is actually
        # imported somewhere under that package's src/ — the phantom-dep
        # class check-pins.js is explicitly blind to (it only covers
        # internal @lannguyensi/* pins). Catches a re-added phantom
        # dependency, or a revert of one already removed (see task a5cd84a0
        # / the glob and js-yaml phantom deps found in domain-router and
        # readme-first-resolver during the ca2aceff review).
        run: npm run check:deps

      - name: Dependency consistency checker unit tests
        # Fixture-based unit tests for the checker function itself
        # (including a negative control); mostly in-memory fixtures, plus a
        # couple of tests that exercise the filesystem loader against
        # disposable temp directories.
        run: npm run test:check-deps

      - name: Build
        # Uses the root `build` script (which topo-orders the wrapped libs
        # before everything else). A bare `npm run build --workspaces`
        # walks alphabetically and fails when a package depends on a
        # workspace sibling that hasn't been built yet (e.g. grounding-mcp
        # depends on grounding-wrapper but sorts before it).
        # Build runs BEFORE typecheck so that any package whose typecheck
        # imports a workspace-sibling dist (e.g. understanding-gate ->
        # hypothesis-tracker) can resolve it.
        run: npm run build

      - name: Typecheck
        # Runs per workspace only if the script is defined — packages that
        # don't have a typecheck entry are silently skipped.
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm run test --workspaces --if-present

      - name: Coverage gate
        # Runs the per-package `test:ci` (test runner + --coverage) only where
        # defined, so each package's declared coverageThreshold actually gates
        # the build. Previously these thresholds (4 jest packages + grounding-mcp,
        # now also evidence-ledger + claim-gate) were declared but never
        # evaluated because CI only ran plain `test`.
        run: npm run test:ci --workspaces --if-present
