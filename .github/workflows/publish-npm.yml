name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - grounding-wrapper
          - evidence-ledger
          - claim-gate
          - hypothesis-tracker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./packages/${{ matrix.package }}/package.json').version")
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag version ($tag_version) does not match packages/${{ matrix.package }}/package.json ($pkg_version)" >&2
            exit 1
          fi

      - name: Verify native store deps load
        # better-sqlite3 (and prebuild-install) silently fall back to source
        # compile on ABI mismatch. Run a tiny require + call before tests so
        # CI fails loudly at the install boundary, not deep in the suite.
        if: matrix.package == 'evidence-ledger'
        run: |
          node -e "const D=require('better-sqlite3');const db=new D(':memory:');console.log('better-sqlite3 ok:', db.prepare('SELECT 1 AS r').get());db.close();"

      - name: Build (topo-ordered libs)
        run: npm run build:deps

      - name: Test the package being published
        run: npm test --workspace=@lannguyensi/${{ matrix.package }}

      - name: Upgrade npm to v11
        # npm >= 11.5.1 required for OIDC-based publishing against each
        # package's Trusted Publisher entry on npmjs.com (repo
        # LanNguyenSi/agent-grounding, workflow publish-npm.yml (4-package matrix));
        # Node 22 bundles npm 10. Auth via id-token permission, no NPM_TOKEN.
        run: npm install -g npm@11

      - name: Publish
        run: npm publish --workspace=@lannguyensi/${{ matrix.package }} --access public --provenance
