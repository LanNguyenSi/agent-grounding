name: merge-approval

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  checks: write
  pull-requests: read
  contents: read

# Serialise runs per PR head — stale runs would post outdated Check-Runs.
concurrency:
  group: merge-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract prereq flags from PR labels
        id: labels
        uses: actions/github-script@v7
        with:
          # eslint-disable-next-line no-eval
          script: |
            const labels = (context.payload.pull_request?.labels ?? [])
              .map((l) => l.name);
            const has = (name) => labels.includes(name);
            core.setOutput('tests_pass',                has('review:tests-pass').toString());
            core.setOutput('checklist_complete',        has('review:checklist-complete').toString());
            core.setOutput('comments_resolved',         has('review:comments-resolved').toString());
            core.setOutput('scope_matches_task',        has('review:scope-matches-task').toString());
            core.setOutput('evidence_logged',           has('review:evidence-logged').toString());

      - name: Run merge-approval gate
        uses: LanNguyenSi/agent-grounding/packages/review-claim-gate/action@97dfa51c5b278048dd6ec1006a6866977398a3cc # review-claim-gate-v0.1.5
        with:
          task-id: ${{ github.event.pull_request.head.ref }}
          pr-number: ${{ github.event.pull_request.number }}
          tests-pass: ${{ steps.labels.outputs.tests_pass }}
          review-checklist-complete: ${{ steps.labels.outputs.checklist_complete }}
          comments-resolved: ${{ steps.labels.outputs.comments_resolved }}
          scope-matches-task: ${{ steps.labels.outputs.scope_matches_task }}
          evidence-logged: ${{ steps.labels.outputs.evidence_logged }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # Pin bumped v0.1.0 -> v0.1.5 (2026-08-22, task 28ee6911) to match
        # the current @lannguyensi/review-claim-gate package version.
        # action.yml is byte-identical between the two tags (`git diff
        # review-claim-gate-v0.1.0 review-claim-gate-v0.1.5 -- action.yml`
        # is empty): same inputs/outputs, so this workflow's usage needed
        # no changes. The bump matters anyway: this action's "Install +
        # build review-claim-gate" step builds the CLI from the checked-out
        # tree at the pinned ref (not a published npm package), so the gate
        # actually ran cli.ts as it stood at v0.1.0 (334 lines) until now,
        # not the 451-line cli.ts docs/okf's citations (e.g.
        # merge-approval-gate-mechanics.md) describe -- v0.1.5's cli.ts is
        # byte-identical to HEAD's. Verified action.yml identical and the
        # CLI build locally; the merge-approval Check-Run on this branch's
        # PR is the live confirmation.
