name: Publish library to npm

# Publishes one workspace package per push of a tag matching `<pkg>-v<version>`.
# Existing packages with their own dedicated workflow keep that one
# (`publish-npm.yml` handles the four legacy libs that move in lockstep,
# `publish-understanding-gate.yml` handles understanding-gate). The packages
# here move independently — each gets its own tag.

on:
  push:
    tags:
      - "grounding-sdk-v*"
      - "grounding-mcp-v*"
      - "debug-playbook-engine-v*"
      - "domain-router-v*"
      - "readme-first-resolver-v*"
      - "review-claim-gate-v*"
      - "runtime-reality-checker-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse tag
        id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          # Strip trailing -v<semver>(-<prerelease>)? to recover the package name.
          pkg=$(echo "$tag" | sed -E 's/-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$//')
          version="${tag#${pkg}-v}"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing @lannguyensi/${pkg}@${version}"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package version matches tag
        env:
          PKG: ${{ steps.parse.outputs.pkg }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          pkg_version=$(node -p "require('./packages/${PKG}/package.json').version")
          if [ "$pkg_version" != "$VERSION" ]; then
            echo "::error::Tag version (${VERSION}) does not match packages/${PKG}/package.json ($pkg_version)" >&2
            exit 1
          fi

      - name: Build (topo-ordered libs)
        run: npm run build:deps

      - name: Build the package being published
        env:
          PKG: ${{ steps.parse.outputs.pkg }}
        run: npm run build --workspace="@lannguyensi/${PKG}"

      - name: Test the package being published
        env:
          PKG: ${{ steps.parse.outputs.pkg }}
        run: npm test --workspace="@lannguyensi/${PKG}"

      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; node 22 bundles
      # npm 10, so upgrade right before the publish step (wave standard:
      # install/build/test run under the node-bundled npm, matching ci.yml).
      # Auth comes from the GitHub OIDC token (permissions.id-token: write
      # above) matched against each package's Trusted Publisher entry on
      # npmjs.com (repo LanNguyenSi/agent-grounding, workflow
      # publish-libs.yml) — no NPM_TOKEN secret involved.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 --no-audit --no-fund

      - name: Publish (OIDC trusted publishing, tokenless)
        env:
          PKG: ${{ steps.parse.outputs.pkg }}
        run: npm publish --workspace="@lannguyensi/${PKG}" --access public --provenance
